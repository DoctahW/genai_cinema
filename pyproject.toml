[project]
name = "genai-cinema"
version = "0.1.0"
description = "Agente Text-to-SQL (PT-BR) sobre a camada Gold do CineData, exposto via FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-ai-slim[openai]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
